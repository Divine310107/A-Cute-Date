<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Atinuke</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  background: linear-gradient(135deg, #000000, #0a1f44);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Inter', sans-serif;
  color: white;
  overflow: hidden;
}

.container {
  text-align: center;
  max-width: 600px;
  padding: 30px;
  animation: fadeIn 1.5s ease;
}

h1 {
  font-size: 40px;
  margin-bottom: 20px;
}

p {
  font-size: 17px;
  line-height: 1.6;
  opacity: 0.9;
}

.button {
  margin-top: 30px;
  padding: 12px 25px;
  border: 1px solid #4da6ff;
  border-radius: 30px;
  background: transparent;
  color: #4da6ff;
  cursor: pointer;
  transition: 0.3s;
  margin-right: 10px;
}

.button:hover {
  background: #4da6ff;
  color: black;
}

.hidden {
  display: none;
  margin-top: 30px;
  animation: fadeIn 1s ease;
}

@keyframes fadeIn {
  from {opacity: 0; transform: translateY(20px);}
  to {opacity: 1; transform: translateY(0);}
}

.glow {
  position: absolute;
  width: 350px;
  height: 350px;
  background: rgba(0, 102, 255, 0.25);
  filter: blur(120px);
  border-radius: 50%;
  top: -100px;
  right: -100px;
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="container">
  <h1>Hey Atinuke</h1>

  <p>
    I thought of doing something special, every time I ask you on a date 😂  
    So here it is...
  </p>

  <div id="question" style="margin-top: 25px;">
    <p style="font-size:18px; margin-bottom:15px;">
      Will you go out on a date with me by 6 pm today?
    </p>

    <button class="button" onclick="sayYes()">Yes</button>
    <button class="button" onclick="sayNo()">No</button>
  </div>

  <div id="response" class="hidden"></div>
</div>

<script>
function sayYes() {
  document.getElementById("response").innerHTML =
    "<p>Perfect. I’ll see you by 6 😊</p>";
  document.getElementById("response").style.display = "block";
}

function sayNo() {
  document.getElementById("response").innerHTML =
    "<p>Are you sure? 🤨</p><br><button class='button' onclick='forceYes()'>Yes</button>";
  document.getElementById("response").style.display = "block";
}

function forceYes() {
  document.getElementById("response").innerHTML =
    "<p>I knew it 😌 See you by 6.</p>";
}
</script>

</body>
</html>
